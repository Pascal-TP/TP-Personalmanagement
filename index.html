<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TP-Personalmanagement V2.2.1</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="login-page" class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/tp-logo.png" alt="TP Logo">
        <div><strong>TP-Personalmanagement</strong><span>Version 2.2.1</span></div>
      </div>
      <h1>Anmelden</h1>
      <p class="muted">Bitte mit E-Mail-Adresse oder Benutzername und Passwort anmelden.</p>
      <form id="login-form" class="stack-form">
        <label>Anmeldename<input id="login-identifier" type="text" autocomplete="username" placeholder="name@firma.de oder benutzername" required></label>
        <label>Passwort<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Anmelden</button>
        <button class="btn secondary" id="forgot-password-btn" type="button">Passwort vergessen</button>
        <p id="login-message" class="message"></p>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <div id="company-logo" class="brand-logo"><img src="assets/tp-logo.png" alt="Firmenlogo"></div>
        <div class="brand-copy"><strong id="company-name">TP Holding GmbH</strong><span>Personalmanagement</span></div>
      </div>
      <div class="role-heading" id="role-heading">Mitarbeiterbereich</div>
      <nav id="main-nav" class="main-nav"></nav>
      <div class="sidebar-footer">
        <button id="change-password-btn" class="sidebar-action">Passwort ändern</button>
        <button id="logout-btn" class="sidebar-action">Abmelden</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Willkommen im TP-Personalmanagement.</p></div>
        <div class="user-menu-wrap">
          <div id="user-chip" class="user-chip" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-controls="mobile-user-menu">
            <div id="user-avatar" class="avatar">TP</div>
            <div><strong id="user-name">–</strong><span id="user-role">–</span></div>
          </div>
          <div id="mobile-user-menu" class="mobile-user-menu" aria-hidden="true">
            <div class="mobile-user-menu-head">
              <strong id="mobile-user-name">–</strong>
              <span id="mobile-user-role">–</span>
            </div>
            <button id="mobile-change-password-btn" type="button">Passwort ändern</button>
            <button id="mobile-logout-btn" type="button" class="logout">Abmelden</button>
          </div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
